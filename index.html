<style>
  :root {

    --card: #161b22;
    --border: #30363d;

    --orange: #d29922;

    --purple: #bc8cff;

  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 0;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 3rem 0 2rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }
  .header h1 {
    font-size: 2.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
  }
  .header p {
    color: var(--muted);
    font-size: 1.1rem;
  }
  .header .count {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.4rem 1.2rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.9rem;
    color: var(--muted);
  }

  /* Category Tabs */
  .categories {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 2rem;
    justify-content: center;
  }
  .cat-btn {
    padding: 0.5rem 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .cat-btn:hover { border-color: var(--accent); color: var(--text); }
  .cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Tool Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 1rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    transition: border-color 0.2s, transform 0.2s;
    position: relative;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card .badge-row {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }
  .card .badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-osint { background: #1a3a2a; color: var(--green); }
  .badge-ddos { background: #3d1a1a; color: var(--red); }
  .badge-phishing { background: #3d2e1a; color: var(--orange); }
  .badge-social { background: #2d1a3d; color: var(--purple); }
  .badge-recon { background: #0d2d4d; color: var(--accent); }
  .badge-learning { background: #1a2d1a; color: #7ee787; }
  .badge-hardware { background: #2d2d1a; color: #d29922; }
  .badge-network { background: #1a2d3d; color: #58a6ff; }
  .badge-phone { background: #2d1a2d; color: var(--pink); }
  .badge-utility { background: #1d1d1d; color: var(--muted); }
  .badge-gps { background: #1a2d2d; color: #79c0ff; }
  .badge-url { background: #2d1d1a; color: #f0883e; }
  .badge-spyware { background: #3d1a2d; color: #f778ba; }
  .badge-wifi { background: #1a3d2d; color: #7ee787; }
  .badge-email { background: #2d1a3d; color: #d2a8ff; }
  .badge-ai { background: #1d1d3d; color: #79c0ff; }

  .card h3 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
  }
  .card h3 a {
    color: var(--accent);
    text-decoration: none;
  }
  .card h3 a:hover { text-decoration: underline; }

  .card .owner {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .card .desc {
    font-size: 0.9rem;
    color: var(--text);
    margin-bottom: 0.75rem;
    line-height: 1.5;
  }

  .card .link-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .card .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8rem;
    padding: 0.35rem 0.75rem;
    background: rgba(88, 166, 255, 0.1);

    border-radius: 6px;
    color: var(--accent);
    text-decoration: none;
    transition: all 0.2s;
  }
  .card .link-btn:hover {

  }

    background: rgba(240, 246, 252, 0.08);

    color: var(--text);
  }
  .card .link-btn.gh:hover {
    background: rgba(240, 246, 252, 0.15);
  }

  .card .copy-btn {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    padding: 0.25rem 0.5rem;
    font-size: 0.7rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card:hover .copy-btn { opacity: 1; }
  .card .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

  .card.hidden { display: none; }

  /* Footer */
  .footer {
    text-align: center;
    padding: 3rem 0;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }

  /* Tags below desc */
  .card .tags {
    display: flex;
    gap: 0.3rem;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }
  .card .tag {
    font-size: 0.7rem;
    padding: 0.1rem 0.5rem;
    background: rgba(139, 148, 158, 0.12);
    border-radius: 4px;
    color: var(--muted);
  }

  @media (max-width: 768px) {
    .container { padding: 1rem; }
    .header h1 { font-size: 1.8rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

const grid = document.getElementById('grid');
const filterBtns = document.querySelectorAll('.cat-btn');

function render(category) {
  const filtered = category === 'all'
    ? tools
    : tools.filter(t => t.categories.includes(category));

  grid.innerHTML = filtered.map(t => {
    const cats = t.categories.map(c => `<span class="badge badge-${c}">${c}</span>`).join('');
    const tags = t.tags.map(tg => `<span class="tag">${tg}</span>`).join('');
    const ghLink = t.url.startsWith('https://github.com')
      ? `<a href="${t.url}" class="link-btn gh" target="_blank" rel="noopener">&#x1f4c2; Repository</a>`
      : `<a href="${t.url}" class="link-btn" target="_blank" rel="noopener">&#x1f310; Website</a>`;
    const readmeLink = t.readme
      ? `<a href="${t.readme}" class="link-btn" target="_blank" rel="noopener" style="--accent:var(--green);border-color:rgba(63,185,80,0.3);color:var(--green);background:rgba(63,185,80,0.08)">&#x1f4d6; README</a>`
      : '';

    return `
      <div class="card" data-categories="${t.categories.join(',')}">
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${t.url}')">Copy URL</button>
        <div class="badge-row">${cats}</div>
        <h3><a href="${t.url}" target="_blank" rel="noopener">${t.name}</a></h3>
        <div class="owner">by ${t.owner}</div>
        <div class="desc">${t.desc}</div>
        <div class="tags">${tags}</div>
        <div class="link-row">${ghLink}${readmeLink}</div>
      </div>
    `;
  }).join('');
}

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.cat);
  });
});

render('all');
